<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konfirmasi Reset Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body style="margin:0;padding:0;background:#71BBB2;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
  
  <div style="background:#ffffff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.2);padding:20px 40px 40px 40px;max-width:600px;width:90%;margin:20px auto;box-sizing:border-box;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <img src="http://62.72.44.203:7001/api/view/webroot/files/upload/2025-07-16/20250716134330000-app-icon_1752648210135359495.png"
              alt="Logo Komdigi"
              style="width:100%;max-width:80px;height:auto;border:0;display:block;" />
        </td>
      </tr>
    </table>
    
    <hr style="border:none;border-top:1px solid #ddd;margin:20px 0;" />
    
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <img src="http://62.72.44.203:7001/api/view/webroot/files/upload/2025-07-16/20250716134431000-emailVer_1752648271737879378.png"
              alt="Email logo"
              style="width:100%;max-width:300px;height:auto;border:0;display:block;" />
        </td>
      </tr>
    </table>
    
    <h2 style="margin:20px 0 10px 0;color:#333;font-weight:600;font-size:24px;line-height:1.2;">Halo, {{.Nama}}</h2>
    
    <p style="color:#555;line-height:1.5;font-size:13px;margin:0 0 20px 0;">
      Akun anda melakukan reset password, silakan ganti password melalui tombol di bawah.
    </p>

    <div style="text-align:center;margin:20px 0;">
      <a href="{{.Url}}" style="text-decoration:none;display:inline-block;">
        <span style="background: #71BBB2;color:#ffffff;border:none;padding:12px 24px;font-size:16px;border-radius:100px;display:inline-block;">
          Reset Password
        </span>
      </a>
    </div>
    
    <p style="color:#555;line-height:1.5;font-size:13px;margin:0 0 20px 0;">
      Jika anda tidak merasa melakukan reset password, abaikan pesan ini.
    </p>
    
    <p style="color:#555;line-height:1.5;font-size:13px;margin:30px 0 0 0;">
      Salam hangat,<br /><strong>Tim Jastiper</strong>
    </p>
  
  </div>
</body>
</html>
